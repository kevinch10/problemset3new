<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HDB Resale Price Explorer</title>
    <meta name="description" content="Compare HDB resale flat prices by town and flat type in Singapore from 2017 until present time with price trends, two-town comparisons, and transaction details." />
    <meta property="og:title" content="HDB Resale Price Explorer" />
    <meta property="og:description" content="Compare HDB resale flat prices by town and flat type in Singapore from 2017 until present time with price trends, two-town comparisons, and transaction details." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Global error shield to prevent cross-origin third-party scripts (e.g., Disqus embed)
      // from generating unhandled "Script error." in iframe or sandboxed environments
      window.addEventListener(
        'error',
        function (event) {
          if (
            event.message === 'Script error.' ||
            (event.filename &&
              (event.filename.indexOf('disqus') !== -1 ||
                event.filename.indexOf('disquscdn') !== -1))
          ) {
            event.preventDefault();
            if (event.stopImmediatePropagation) {
              event.stopImmediatePropagation();
            }
            return true;
          }
        },
        true
      );

      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason ? String(event.reason) : '';
        if (
          reason.indexOf('disqus') !== -1 ||
          reason.indexOf('Script error') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) {
            event.stopImmediatePropagation();
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
